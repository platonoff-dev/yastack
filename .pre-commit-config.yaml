# The only gate: there is no CI. Install once per clone with `pre-commit install`.
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.1
    hooks:
      - id: markdownlint-cli2
        # nodeenv can't parse the latest (alpha) Node release; stay on LTS.
        language_version: lts

  - repo: local
    hooks:
      - id: yastack-check
        name: yastack invariants (scripts/check.py)
        entry: python3 scripts/check.py
        language: system
        pass_filenames: false
        always_run: true
      - id: plugin-validate
        name: plugin and marketplace manifests (claude plugin validate)
        entry: claude plugin validate .
        language: system
        pass_filenames: false
        always_run: true
